name: trulura
description: "TruLura is a vibrant, social-first platform designed to forge genuine connections, offering flexible modes for everything from casual networking to sparking new relationships."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  http: ^1.0.0
  supabase_flutter: '>=1.10.0'
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  shared_preferences: ^2.0.0
  image_picker: '>=1.1.2'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dreamflow_icon.jpg
  remove_alpha_ios: true
